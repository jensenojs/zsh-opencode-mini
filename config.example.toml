# zsh-opencode-mini configuration.
# One file, two consumers:
#   - [shell]: read by zsh-opencode-mini.plugin.zsh
#   - [companion] and [recipes]: read by companion.js
# Both sides parse it with python's tomllib, so there is one parser and no
# dialect drift. Copy to ~/.config/zsh-opencode-mini/config.toml to activate.
# Every key is optional; the values shown are the defaults. Comment a key out
# (or delete it) to take the default.

[shell]
# Absolute path of the command-history store.
# Omit for ~/.local/share/zsh-opencode-mini (XDG_DATA_HOME respected).
# dataDir = "~/.local/share/zsh-opencode-mini"

# Key to summon opencode mini ("^X" by default; "off" disables the binding).
keybind = "^X"

# Other sequences starting with the summon key (zsh's emacs map ships a "^X…"
# family) make zsh wait KEYTIMEOUT on every bare press. The plugin only reports
# them; to remove them, add e.g. bindkey -rp "<summon key>" to your own zshrc
# after this plugin loads.
#   "notify" (default) one-time warning naming what is shadowed
#   "off"    stay silent
keybindConflict = "notify"

# Which session C-x resumes:
#   "main" (default) — one dedicated assistant session (ses_zom-main),
#                      isolated from your other opencode sessions
#   "off"            — a fresh session every time
resume = "main"

# What mini redraws when the main session opens (only affects resume:"main").
# "on" (default) prints the newest replayLimit messages; "off" passes
# --no-replay and opens straight at the input line. The session itself keeps
# its full history.
replay = "on"

# Newest-N message cap for replay ("replay":"on" only; default 50, upstream
# default is 200). The fork caps the page it asks the server for, so values
# above 200 are safe but the transcript stops at 200 messages.
replayLimit = 50

# opencode binary mini launches. Default "opencode-zom": the zom fork installed
# by scripts/install-zom-binary.sh (inline scrollback on resume, key
# passthrough). Missing binary fails loudly at launch; there is no silent
# fallback to the official binary (it clears the screen on resume). Pin an
# absolute path to use a specific build.
# binary = "opencode-zom"

# Keys nobody claims inside mini (not a keymap action, not composer input):
# "on" (default) logs them to <dataDir>/passthrough.<pid>.keys.log (rolling
# cap, newest kept) and mini keeps running — an unhandled key never kills the
# TUI; "off" restores swallowing the key.
passthrough = "on"

# Comma-separated strokes that keep the old exit-and-replay behaviour: mini
# exits and the widget replays the raw bytes into ZLE, so the key takes effect
# at the shell prompt. Example: "ctrl+r".
passthroughKeys = ""

# Monthly history files older than this many months are deleted when a shell
# starts. "off" keeps everything.
historyRetainMonths = 6

# Per-command OSC report (ESC ] 7777 ; zom ; v1 ; <base64 json> BEL). A private
# protocol for terminal-side receivers; terminals without one swallow it
# silently. "off" also saves one base64 fork per command.
osc = "on"

# Prompt pre-filled (not sent) in the composer after a failed command, within
# failureTtlSeconds. Each failure prefills once — seen is consumed, whether or
# not you sent it; a new failure prefills again. Placeholders: {cmd} {exit}
# {cwd}. Omit for the built-in Chinese template; "off" disables the prefill.
# failurePrefill = "上一条命令失败了（exit {exit}）：{cmd}\n帮我分析失败原因并给出修复建议"

# Keep a bounded stderr tail (<dataDir>/stderr-tail.log, ~256 KB window) via
# one resident tee process, and store the tail of a failed command's stderr
# (last ~20 lines, 4 KB cap) into last-failure.json so recipes and zom_context
# can see WHY it failed. stderr still reaches the terminal byte for byte. "off"
# removes the tee and the stderr field.
stderrCapture = "on"

# Optional model pin, "provider/model#variant" — e.g.
# "zhipuai-coding-plan/glm-5.3-flash#low". Empty follows the global default
# model untouched. mini has no variant-only flag.
model = ""

# Leader for mini's own keybindings ("ctrl+g" by default). mini binds ctrl+x to
# "hide back to the shell", so it cannot share the main TUI's leader; this one
# is passed to the binary as --leader and affects mini only.
#
# Anything the terminal only tells apart through the kitty keyboard protocol is
# a bad default: without that protocol ctrl+m is a plain Enter, ctrl+i is Tab,
# ctrl+[ is Esc. mini asks for the protocol itself, so such keys work inside
# mini on terminals that support it — but if they don't, the leader silently
# becomes Enter. Keep a real control key here unless you know your terminal.
leader = "ctrl+g"

[companion]
# How long (seconds) a failed command stays "fresh" for context injection.
failureTtlSeconds = 600
# Lines returned by the zom_context tool with query=recent.
recentDefaultN = 20
# Identical failures of one command within a day that trigger a single outbox
# hint (0 disables).
repeatFailureThreshold = 3

[recipes]
# Declarative model calls fired from shell events, evaluated by the opencode
# side. Each recipe is a named table; the name becomes the tool name
# (on:"manual") and the [zom:<name>] provenance tag, so it must match
# ^[a-zA-Z0-9_-]+$.
#
# Per-recipe fields:
#   on          "failure" (a failed shell command was recorded)
#               | "bg-done" (a background session spawned via zom-bg finished;
#               {sid} and {cwd} are filled)
#               | "manual"  (the agent gets a zom_recipe_<name> tool)
#   model       "provider/model-id" — the model that runs the prompt
#   prompt      template; {cmd} {exit} {cwd} are filled from the event, plus
#               {stderr} for on:"failure" (the bounded stderr tail, "" when
#               capture is off)
#   deliver     "next-session" (injected into the next mini session, tagged
#               [zom:<name>], expires after ttlSeconds)
#               | "outbox" (one line in outbox.jsonl, shown by the shell before
#               the next prompt as `zom: <text>`)
#   exitFilter  optional array of exit codes to fire on (omit = all)
#   ratePerHour optional cap of model calls per hour (omit = unlimited)
#   ttlSeconds  lifetime of next-session injections (default 900)
#
# The table below is a working example: on a failed command, a model looks at
# the failing command and hands the user one concrete hint before their next
# prompt — at most 6 per hour, only for command-not-found (127) and git
# failures (128).

[recipes.failure-hint]
on = "failure"
model = "anthropic/claude-haiku-4.5"
prompt = "The shell command {cmd} failed with exit code {exit} in {cwd}. In one short sentence, name the most likely cause or the single most useful fix. Plain text only."
deliver = "outbox"
exitFilter = [127, 128]
ratePerHour = 6
